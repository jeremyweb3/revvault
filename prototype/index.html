<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RevVault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='5' fill='%233E68FE'/%3E%3Cg fill='none' stroke='white' stroke-width='1.4' stroke-linecap='round'%3E%3Crect x='4' y='5' width='12' height='10' rx='2.5'/%3E%3Ccircle cx='10' cy='10' r='2.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--text)}
body{font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .warn-t{color:var(--warn)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--blue-400);outline-offset:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r-pill);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background-color .2s var(--glide),box-shadow .2s var(--glide),opacity .15s,transform .15s var(--glide)}
.btn:active{transform:scale(.98)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow-btn)}
.btn.primary:hover{background:var(--blue-hover)}
.btn.secondary{background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.secondary:hover{background:var(--hover)}
.btn.danger{color:var(--down);background:rgba(255,126,97,.1);box-shadow:inset 0 0 0 1px rgba(255,126,97,.22)}
.btn.ghost{color:var(--mute)} .btn.ghost:hover{color:var(--text);background:var(--card-2)}
.btn[disabled]{opacity:.6;cursor:not-allowed;box-shadow:none}
.act-main{height:42px;padding:0 20px 0 16px;color:var(--accent-ink);background:var(--accent);box-shadow:var(--glow-btn)}
.act-main:hover{background:var(--blue-hover)}
.act-ghost{height:42px;padding:0 16px 0 13px;color:var(--text);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.act-ghost:hover{background:var(--hover)}
.act-ghost svg{color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--r-pill);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;font-weight:500;white-space:nowrap}
.pill:hover{background:var(--hover)}
.pill svg{width:15px;height:15px}
.round{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--mute)}
.round:hover{color:var(--text);background:var(--hover)} .round svg{width:16px;height:16px}
.badge{--t:62,104,254;--ic:var(--accent-text);display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-tile);color:var(--ic);background:radial-gradient(50% 50% at 50% 0,rgba(var(--t),.30) 0%,var(--card) 100%);box-shadow:inset 0 0 0 1px rgba(var(--t),.28)}
.badge svg{width:18px;height:18px}
.badge[data-tone]{--ic:rgb(var(--t))}
.badge[data-tone="op"]{--t:92,211,255}.badge[data-tone="warn"]{--t:242,190,92}.badge[data-tone="ok"]{--t:134,227,181}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;background:var(--card-2);color:var(--mute);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:rgba(134,227,181,.11);color:var(--ok)}
.chip.bad{background:rgba(255,126,97,.13);color:var(--down)}
.chip.warn{background:rgba(242,190,92,.13);color:var(--warn)}
.chip.blue{background:var(--accent-soft);color:var(--accent-text)}
.chip.op{background:rgba(92,211,255,.12);color:var(--op)}

.shell{display:flex;flex-direction:column;gap:16px;padding:20px 16px 48px;max-width:1280px;margin:0 auto;min-height:100vh}
.card{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-card);transition:box-shadow .3s var(--glide)}
.glow{background:var(--glow-card);box-shadow:inset 0 0 0 1px var(--accent-line)}
.fnav{position:sticky;top:20px;z-index:40;display:flex;justify-content:center;pointer-events:none}
.fnav-in{pointer-events:auto;display:flex;align-items:center;gap:6px;width:100%;padding:10px 10px 10px 22px;border-radius:44px;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 0 0 1px var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-right:14px;flex:none}
.brand .mk{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand .mk svg{width:15px;height:15px}
.brand .wm{font:700 16px/1 var(--sans);letter-spacing:-.02em;color:#fff}
.nav{display:flex;align-items:center;gap:2px;margin:0 auto}
.nav button{position:relative;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-pill);color:var(--link);font-size:14px;font-weight:500;white-space:nowrap;transition:background-color .2s,color .2s}
.nav svg{width:16px;height:16px;color:var(--faint)}
.nav button:hover{background:var(--glass-fill);color:#fff}.nav button:hover svg{color:#fff}
.nav [aria-current="page"]{color:#fff;font-weight:600;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav [aria-current="page"] svg{color:var(--accent-text)}
.nav .dotn{position:absolute;top:8px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.more-wrap{position:relative}
.more-wrap .chev{width:14px;height:14px;transition:transform .15s}
.more-wrap button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 10px);z-index:45;width:230px;padding:6px;border-radius:var(--r-card);background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2),0 24px 50px -12px rgba(0,0,0,.7);animation:pop .15s var(--glide)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;border-radius:var(--r-tile);color:var(--link);font-size:13.5px;font-weight:500;text-align:left}
.menu button svg{width:16px;height:16px;color:var(--faint)}
.menu button:hover,.menu button[aria-current="page"]{background:var(--glass-fill);color:#fff}
.menu small{display:block;color:var(--faint);font-size:11.5px;font-weight:400;margin-top:1px}
.netchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;color:var(--mute);flex:none}
.netchip i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.acct-chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 5px;border-radius:var(--r-pill);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.acct-chip:hover{background:var(--hover)}
.acct-chip .wav{width:28px;height:28px;border-radius:50%;background:conic-gradient(from 90deg,var(--op),var(--blue-400),var(--blue-500),var(--op))}
.acct-chip small{color:var(--mute);font-weight:500}
.body{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.crumb{display:flex;align-items:baseline;gap:10px;flex:none}
.crumb h1{font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.crumb span{color:var(--faint);font-size:13px;white-space:nowrap}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}

.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ch h2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.ch .see-all{padding:6px 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font:500 12.5px/1 var(--sans);white-space:nowrap}
.ch .see-all:hover{color:var(--text);background:rgba(255,255,255,.08)}
.panel{padding:20px}
.panel .ch{flex-wrap:wrap;row-gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{padding:18px 20px 20px;display:flex;flex-direction:column;min-width:0}
.stat .ch{margin-bottom:16px}.stat .ch h2{font-size:14px}
.stat .v{font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1}
.stat .v small{font-size:14px;font-weight:500;color:var(--mute);margin-left:6px;letter-spacing:0}
.stat .d{margin-top:12px;color:var(--mute);font-size:13px}.stat .d b{font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden;display:flex;margin-top:12px;gap:2px}
.meter i{display:block;height:100%;transition:width .9s var(--glide)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:var(--card-2);gap:2px}
.seg button{height:26px;padding:0 11px;border-radius:var(--r-pill);color:var(--mute);font-size:12px;font-weight:600}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--page);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rule{padding:11px 14px;border-radius:14px;background:var(--card-2)}
.rule .k{display:block;color:var(--faint);font-size:12px;font-weight:500}
.rule b{font-weight:600}
.mandate{color:var(--mute);line-height:1.6;margin-bottom:14px}.mandate b{color:var(--text);font-weight:600}

.loan-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.loan-top .big{font-size:36px;font-weight:500;letter-spacing:-.03em;line-height:1}
.loan-top .big small{font-size:14px;color:var(--mute);margin-left:6px;letter-spacing:0}
.debt{position:relative;height:14px;border-radius:7px;background:var(--card-2);overflow:hidden;display:flex;margin:18px 0 10px}
.debt i{display:block;height:100%;transition:width 1.1s var(--glide)}
.debt .paid{background:var(--ok)}
.debt .flash{background:var(--repay)}
.debt-l{display:flex;justify-content:space-between;color:var(--faint);font-size:12.5px;gap:10px;flex-wrap:wrap}
.debt-l b{color:var(--text);font-weight:600}
.splitviz{margin-top:16px;padding:14px;border-radius:var(--r-item);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);display:none}
.splitviz.on{display:block;animation:pop .25s var(--glide)}
.sv-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:12px}
.sv-bar{display:flex;height:34px;border-radius:var(--r-tile);overflow:hidden;gap:3px}
.sv-bar i{display:grid;place-items:center;height:100%;font-style:normal;font-size:12px;font-weight:700;color:var(--ink);transform-origin:left;white-space:nowrap}
.sv-bar .a{background:var(--repay);width:0;animation:grow .9s .35s var(--glide) forwards}
.sv-bar .b{background:var(--up);width:0;animation:grow .9s .35s var(--glide) forwards}
.sv-bar.start{background:var(--accent);animation:none}
@keyframes grow{to{width:var(--w)}}
.sv-leg{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mute)}
.sv-leg b{color:var(--text);font-weight:600}
.empty{padding:28px 12px;text-align:center;color:var(--faint)}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px}

.chart{width:100%;height:150px;display:block}
.chart rect{fill:var(--accent);opacity:.7;transition:opacity .15s}
.chart rect:hover{opacity:1}
.chart .lim{stroke:var(--up);stroke-dasharray:4 4;stroke-width:1.2}
.chart-cap{display:flex;justify-content:space-between;color:var(--faint);font-size:12px;margin-top:8px}

.evs{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-item);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line)}
.ev.fresh{animation:fresh 1.8s ease}
@keyframes fresh{from{background:var(--accent-soft)}to{background:var(--card-2)}}
.ev .badge{width:32px;height:32px;border-radius:10px}.ev .badge svg{width:15px;height:15px}
.ev-t{font-weight:600;font-size:13.5px}
.ev p{color:var(--mute);font-size:12px;margin-top:2px}
.ev .w{text-align:right;font-size:12px;color:var(--faint);white-space:nowrap}
.ev .w b{display:block;color:var(--text);font-size:13px;font-weight:600}

.tablewrap{overflow-x:auto;margin:0 -20px -20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:500;font-size:12px;padding:10px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.t{color:var(--faint);white-space:nowrap}
.amt{text-align:right;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.av{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-weight:700;font-size:10px;color:#fff;background:color-mix(in srgb,var(--c,var(--blue-400)) 30%,var(--card-2))}
.mini-meter{display:block;width:110px;height:5px;border-radius:3px;background:var(--card-2);overflow:hidden}
.mini-meter i{display:block;height:100%;background:var(--ok)}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2),0 30px 80px rgba(0,0,0,.7);border-radius:var(--r-panel);animation:pop .2s var(--glide)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-h{padding:22px 24px 0}
.steps{display:flex;gap:4px;margin-bottom:16px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--card-2)}.steps i.on{background:var(--accent)}
.modal-h .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.modal-h h2{font-size:19px;font-weight:600;letter-spacing:-.01em}.modal-h .row span{color:var(--faint);font-size:12.5px}
.modal-b{padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.field label{display:block;color:var(--mute);font-size:12.5px;font-weight:500;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select{width:100%;padding:11px 14px;border-radius:14px;background:var(--page);border:1px solid var(--line-2);font-size:14px}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.bigamt{display:flex;align-items:baseline;gap:8px;font-size:40px;font-weight:500;letter-spacing:-.03em}
.bigamt small{font-size:14px;color:var(--mute);letter-spacing:0}
.hint{color:var(--faint);font-size:12.5px}
.review{padding:14px;border-radius:var(--r-item);background:var(--card-2);color:var(--mute);line-height:1.7}
.review .row{display:flex;justify-content:space-between}.review b{color:var(--text);font-weight:600}
.review hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.picks{display:grid;gap:8px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-item);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);text-align:left;width:100%}
.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--accent-line);background:var(--accent-soft)}
.pick b{display:block;font-weight:600}.pick small{color:var(--faint);font-size:12px}
.pick .av{width:32px;height:32px;font-size:11px}
.toast{position:fixed;left:50%;top:max(24px,env(safe-area-inset-top,0px));z-index:60;transform:translate(-50%,-20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-card);background:rgba(255,126,97,.1);box-shadow:inset 0 0 0 1px rgba(255,126,97,.25);color:var(--down);font-weight:600}
.banner svg{width:18px;height:18px}
.banner.info{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);color:var(--accent-text)}

.payview{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.phone{width:310px;margin:0 auto;padding:14px;border-radius:38px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2),0 30px 60px -20px rgba(0,0,0,.7)}
.phone-in{border-radius:26px;background:var(--card);padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-height:480px}
.ph-biz{display:flex;align-items:center;gap:10px}
.ph-biz .av{width:36px;height:36px;font-size:12px}
.ph-amt{font-size:38px;font-weight:500;letter-spacing:-.03em;margin-top:8px}.ph-amt small{font-size:14px;color:var(--mute);margin-left:6px}
.ph-how{margin-top:auto;font-size:12px;color:var(--faint);line-height:1.5;padding:10px 12px;border-radius:var(--r-tile);background:var(--card-2)}
.ph-ok{display:none;text-align:center;padding:20px 0}
.ph-ok.on{display:block;animation:pop .3s}
.linkbox{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--page);box-shadow:inset 0 0 0 1px var(--line-2);font-size:13px;color:var(--mute);overflow:hidden}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.democtl{display:flex;flex-wrap:wrap;gap:8px}

@media (max-width:1240px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.grid2,.payview{grid-template-columns:1fr}}
@media (max-width:1240px){
  .netchip span,.acct-chip small{display:none}
}
@media (max-width:960px){
  .fnav-in{overflow:visible}
  .brand .wm{display:none}
  .brand{padding-right:6px}
  .nav button{padding:0 12px}
}
@media (max-width:860px){
  .acct-chip .addr{display:none}.acct-chip{padding:0 5px}
}
@media (max-width:640px){
  .shell{padding:12px 10px 40px}
  .nav button .lbl{display:none}
  .nav button{padding:0 13px}
  .acct-chip .addr{display:none}.acct-chip{padding:0 5px}
  .netchip{display:none}
  .fnav-in{padding-left:12px}
  .stat .ch .see-all{display:none}
  .stats{gap:10px}.stat{padding:14px}.stat .v{font-size:24px}.stat .d{font-size:12px}
  .rules{grid-template-columns:1fr}
  .phone{width:100%}
}
@media (prefers-reduced-motion:reduce){.sv-bar .a,.sv-bar .b{width:var(--w)}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="fnav"><div class="fnav-in">
    <a class="brand" href="landing.html" aria-label="RevVault landing"><span class="mk"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="3"/><circle cx="10" cy="10" r="2.6"/><path d="M10 7.4V6M10 14v-1.4"/></svg></span><span class="wm">RevVault</span></a>
    <nav class="nav" id="nav-main" aria-label="Main"></nav>
    <span class="netchip" title="Mock data. Contracts connect later."><i></i><span>Mock · testnet</span></span>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const f2 = n => Number(n).toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2});
const f0 = n => Math.round(n).toLocaleString('en');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I = {
  home:'<path d="M3 9.5L10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-5h-5v5H4a1 1 0 0 1-1-1z"/>',
  loan:'<rect x="3" y="5" width="14" height="10" rx="2.5"/><path d="M3 9h14M6.5 12.5h2"/>',
  link:'<path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2l-.9.9"/><path d="M11.5 8.5a3 3 0 0 0-4.2 0L4.7 11.1a3 3 0 0 0 4.2 4.2l.9-.9"/>',
  pulse:'<path d="M2.5 10h3l2-5 3.5 10 2-5h4.5"/>',
  vault:'<rect x="3" y="4" width="14" height="12" rx="3"/><circle cx="10" cy="10" r="2.6"/>',
  sliders:'<path d="M4 6h8M15 6h1M4 14h1M8 14h8"/><circle cx="13.5" cy="6" r="1.6"/><circle cx="6.5" cy="14" r="1.6"/>',
  coin:'<circle cx="10" cy="10" r="7"/><path d="M10 6.5v7M8 8.3c0-.9.9-1.4 2-1.4s2 .5 2 1.4-.9 1.2-2 1.4-2 .5-2 1.4.9 1.4 2 1.4 2-.5 2-1.4"/>',
  trend:'<path d="M3 14l4.5-4.5 3 3L17 6"/><path d="M12 6h5v5"/>',
  shield:'<path d="M10 3l6 2v4.5c0 3.6-2.5 6-6 7.5-3.5-1.5-6-3.9-6-7.5V5z"/><path d="M7.5 10l2 2 3.5-3.5"/>',
  down:'<path d="M10 3.5v9M6 8.5l4 4 4-4"/><path d="M4 15.5h12"/>',
  up:'<path d="M10 16.5v-9M6 11.5l4-4 4 4"/><path d="M4 4.5h12"/>',
  split:'<path d="M10 3v5M10 8L5 15M10 8l5 7"/>',
  clock:'<circle cx="10" cy="10" r="7"/><path d="M10 6v4.5l3 1.5"/>',
  bot:'<rect x="4" y="6" width="12" height="9" rx="3"/><path d="M10 3v3M7.5 10.5v.5M12.5 10.5v.5"/>',
  play:'<path d="M6 4.5l9 5.5-9 5.5z"/>',
  plus:'<path d="M10 4v12M4 10h12"/>',
  copy:'<rect x="6.5" y="6.5" width="10" height="10" rx="2.5"/><path d="M13.5 6.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v7A1.5 1.5 0 0 0 5 13.5h1.5"/>',
  warn:'<path d="M10 3.5l7 12H3z"/><path d="M10 8.5v3M10 13.5v.3"/>',
  check:'<path d="M4 10.5l4 4 8-9"/>',
  left:'<path d="M12 4l-6 6 6 6"/>',
  refresh:'<path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 4v3.5h-3.5"/>'
};
const ic = (n, w = 1.6) => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const badge = (n, tone) => `<span class="badge" ${tone ? `data-tone="${tone}"` : ''}>${ic(n)}</span>`;

const P = {
  advanceBps:{agent:4000, creator:3000}, capUSDC:2000, feeBps:300, termDays:60, windowDays:30,
  reserveBps:5000, splitBps:2000, pastDueSplitBps:5000, graceDays:14, starterLimit:0, maxDraw:500, minDraw:10
};
const MODE = 'mock';
const BUSINESSES = {agent:{id:'biz-agent.testnet', label:'Agent', ini:'BA', prefix:'inv'}, creator:{id:'luna.testnet', label:'Creator', ini:'LU', prefix:'tip'}};
const VENDORS = [
  {id:'gpu', name:'GPU-Provider', what:'Compute', c:'var(--op)', ini:'GP', kinds:['agent'], proof:null},
  {id:'llm', name:'LLM-API', what:'Inference credits', c:'var(--violet)', ini:'LA', kinds:['agent'], proof:null},
  {id:'data', name:'Data-Feed', what:'Market data', c:'var(--ok)', ini:'DF', kinds:['agent'], proof:null},
  {id:'render', name:'Render-Farm', what:'Compute', c:'var(--op)', ini:'RF', kinds:['creator'], proof:null},
  {id:'audio', name:'Sound-Library', what:'Licensed audio', c:'var(--violet)', ini:'SL', kinds:['creator'], proof:null}
];
const vendorsFor = kind => VENDORS.filter(v => v.kinds.includes(kind));
const railLabel = v => v.proof ? 'via NEAR Intents' : MODE === 'testnet' ? 'Direct FT (testnet)' : 'Paid (mock)';
const COPY = {
  agent:{
    mandate:'Humans set the <b>constraints</b>. The agent runs the business inside them: it can draw credit, pay vendors and receive payments, nothing else.',
    access:['Agent key', 'draw + receive only'], activity:'Agent activity', who:'Agent business',
    pay:'Share this link with customers or other agents.', direct:'Revenue paid directly to your wallet is not collateral. Only routed payments count.'
  },
  creator:{
    mandate:'You set the <b>constraints</b>. Credit can only pay approved vendors such as render farms and licensed audio, and your income arrives through the pay link.',
    access:['Draw access', 'approved vendors only'], activity:'Creator activity', who:'Creator',
    pay:'Share this link with fans, sponsors and clients. Tips, sponsor invoices and commissions all count when they are paid through it.', direct:'Income paid outside the link, such as ad revenue or card payouts, is invisible to RevVault. Only routed payments count.'
  }
};
const SPIKY = [35,0,12,0,0,560,25,0,0,18,390,0,0,30,0,0,15,520,0,22,0,0,0,440,40,0,0,175,0,118];
const mk = (id, biz, kind, principal, paid, due, st, vendor, splitBps) => { const fee = principal * P.feeBps / 1e4; return {id, biz, kind, principal, fee, repaid:(principal + fee) * paid, due, st, vendor, splitBps}; };
const seedOthers = () => [
  mk('ln_017', 'luna.testnet', 'creator', 300, .22, 41, 'open', 'Render-Farm', P.splitBps),
  mk('ln_019', 'shop-bot.testnet', 'agent', 1200, .72, 9, 'open', 'GPU-Provider', P.splitBps),
  mk('ln_020', 'seo-agent.testnet', 'agent', 800, .35, 18, 'open', 'LLM-API', P.splitBps),
  mk('ln_009', 'dataco.testnet', 'agent', 500, .05, -3, 'delinquent', 'Data-Feed', P.pastDueSplitBps)
];
const seedSettled = () => [mk('ln_000', 'seo-agent.testnet', 'agent', 400, 1, 0, 'settled', 'GPU-Provider', P.splitBps)];
let S;
function seed(kind = 'agent'){
  const B = BUSINESSES[kind];
  const rev = kind === 'creator' ? SPIKY.slice() : Array.from({length:30}, (_, i) => Math.round(40 + 80 * i / 29 + (i % 3 - 1) * 6));
  S = { day:0, kind, biz:B.id, split:P.splitBps / 1e4, rev, loan:null, status:'active', wallet:1240, noteFilter:'all',
        vault:{cash:21500, shares:22800, others:seedOthers().filter(o => o.biz !== B.id), settled:seedSettled(), fees:96, reserve:48},
        events:[{k:'payment_routed', t:'Today · 09:12', title:'Payment routed', text:`${B.prefix}_2041 · 118.00 USDC`, amt:118}],
        closed:[], myLp:{shares:1000}, seq:1, inv:2042 };
}
seed();
const kindLabel = () => BUSINESSES[S.kind].label;
const advanceRate = () => P.advanceBps[S.kind] / 1e4;
const effSplit = () => S.status === 'delinquent' ? Math.max(S.split, P.pastDueSplitBps / 1e4) : S.split;
const trailing = () => S.rev.slice(-P.windowDays).reduce((a, b) => a + b, 0);
const debtOf = l => l.principal + l.fee;
const debtLeft = () => S.loan ? debtOf(S.loan) - S.loan.repaid : 0;
const limit = () => trailing() === 0 ? P.starterLimit : Math.min(trailing() * advanceRate(), P.capUSDC);
const avail = () => S.status !== 'active' ? 0 : Math.max(0, limit() - debtLeft());
const canDraw = () => !S.loan && avail() >= P.minDraw;
const outstanding = l => l.principal * (1 - l.repaid / debtOf(l));
const othersOut = () => S.vault.others.reduce((s, l) => s + outstanding(l), 0);
const myOut = () => S.loan ? outstanding(S.loan) : 0;
const tvl = () => S.vault.cash + othersOut() + myOut();
const util = () => (othersOut() + myOut()) / tvl();
const nav = () => tvl() / S.vault.shares;
const apy = () => P.feeBps / 1e4 / P.termDays * 365 * util() * (1 - P.reserveBps / 1e4) * 100;
const avg7 = () => S.rev.slice(-7).reduce((a, b) => a + b, 0) / 7;
const daysToClear = debt => Math.ceil(debt / Math.max(1, avg7() * effSplit()));
const nextNoteId = () => `ln_${String(S.seq).padStart(3, '0')}`;
const stamp = () => `Day ${S.day} · ${new Date().toTimeString().slice(0, 5)}`;
const log = (k, title, text, amt, extra) => { S.events.unshift({k, t:stamp(), title, text, amt, fresh:true, ...extra}); if(S.events.length > 40) S.events.length = 40; };

function routePayment(amount, ref){
  S.rev[S.rev.length - 1] += amount;
  let repay = 0;
  if(S.loan && S.status !== 'paused'){
    repay = Math.min(amount * effSplit(), debtLeft());
    const frac = repay / debtOf(S.loan), feePart = S.loan.fee * frac;
    S.loan.repaid += repay;
    S.vault.cash += repay; S.vault.fees += feePart; S.vault.reserve += feePart * P.reserveBps / 1e4;
  }
  S.wallet += amount - repay;
  log('payment_routed', 'Payment routed', `${ref} · ${f2(amount)} USDC`, amount);
  if(repay) log('repay_applied', 'Self-repaid', `${f2(repay)} USDC taken from ${ref}`, repay);
  let closed = false;
  if(S.loan && debtLeft() < .005){
    const L = S.loan; L.repaid = debtOf(L); closed = true; S.closed.unshift(L);
    log('loan_closed', 'Loan closed', `${L.id} fully repaid · limit restored`, L.principal);
    log('note_settled', 'Revenue note settled', `${L.id} repaid in full`, debtOf(L));
    S.loan = null; if(S.status === 'delinquent') S.status = 'active';
  }
  return {repay, toBiz:amount - repay, closed};
}
function requestDraw(amount, vendor, memo){
  if(S.loan) return null;
  const fee = amount * P.feeBps / 1e4, id = nextNoteId();
  S.seq++;
  S.vault.cash -= amount;
  S.loan = {id, biz:S.biz, kind:S.kind, vendor, principal:amount, fee, repaid:0, open:S.day, due:S.day + P.termDays, memo, splitBps:P.splitBps};
  log('draw_opened', 'Draw opened', `${f2(amount)} USDC · repay ${f2(amount + fee)} · ${id}`, amount);
  log('note_minted', 'Revenue note minted', `${id} · held by the pool`, amount + fee);
  log('vendor_paid', 'Vendor paid', `${vendor.name} received ${f2(amount)} USDC · ${railLabel(vendor)}`, amount);
  return S.loan;
}
function fastForward(days){
  for(let i = 0; i < days; i++){ S.day++; S.rev.push(0); S.rev.shift(); }
  if(S.loan && S.day > S.loan.due && S.status === 'active'){ S.status = 'delinquent'; log('loan_past_due', 'Marked past due', `${S.loan.id} is past due · limit set to 0 · split stepped up to ${f0(P.pastDueSplitBps / 100)}%`, 0); }
  S.vault.others.forEach(o => { if(o.st === 'open' && S.day > o.due){ o.st = 'delinquent'; o.splitBps = Math.max(o.splitBps, P.pastDueSplitBps); } });
}

let view = 'business', fresh = null;
const MAIN = [['business','home','Dashboard'],['loans','loan','Loans'],['pay','link','Pay links'],['lp','vault','Notes and Vault']];
const MORE = [['activity','pulse','Activity','Every cent, on the record'],['demo','sliders','Demo control','Presenter tools']];
const TITLES = {business:['Dashboard', ''], loans:['Loans','Every draw, on the record'], pay:['Pay links','Revenue routed here becomes credit'], activity:['Activity','Every cent, on the record'], lp:['Notes and Vault','Revenue notes and pool shares'], demo:['Demo control','Presenter tools · mock mode']};
const kindChip = () => `<span class="chip ${S.kind === 'creator' ? 'op' : 'blue'}">${kindLabel()}</span>`;
let moreOpen = false;
function renderSide(){
  const inMore = MORE.some(m => m[0] === view);
  $('#nav-main').innerHTML = MAIN.map(([v, i, t]) => `<button data-nav="${v}" title="${t}" ${view === v ? 'aria-current="page"' : ''}>${ic(i)}<span class="lbl">${t}</span>${v === 'loans' && S.loan ? '<span class="dotn"></span>' : ''}</button>`).join('') +
    `<div class="more-wrap"><button id="more-btn" title="More" aria-haspopup="menu" aria-expanded="${moreOpen}" ${inMore ? 'aria-current="page"' : ''}>${ic('plus')}<span class="lbl">More</span><svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l4 4 4-4"/></svg></button>
    <div class="menu" id="more-menu" role="menu" ${moreOpen ? '' : 'hidden'}>${MORE.map(([v, i, t, s]) => `<button role="menuitem" data-nav="${v}" ${view === v ? 'aria-current="page"' : ''}>${ic(i)}<span>${t}<small>${s}</small></span></button>`).join('')}</div></div>`;
  $$('#nav-main [data-nav]').forEach(b => b.onclick = () => { moreOpen = false; go(b.dataset.nav); });
  $('#more-btn').onclick = e => { e.stopPropagation(); moreOpen = !moreOpen; renderSide(); };
  $('#acct-bal').textContent = f2(avail()) + ' USDC credit';
  $('.acct-chip .addr').textContent = S.biz;
  const [t, s] = TITLES[view];
  $('#crumb').innerHTML = `<h1>${t}</h1><span>${view === 'business' ? esc(S.biz) : s}</span>${view === 'business' ? kindChip() : ''}`;
}
function go(v){ moreOpen = false; view = v; location.hash = '#/' + v; render(); window.scrollTo({top:0}); }
function render(){
  renderSide();
  const fn = {business:vBusiness, loans:vLoans, pay:vPay, activity:vActivity, lp:vLp, demo:vDemo}[view];
  $('#main').innerHTML = fn(); bind();
  fresh = null;
}
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }
const stat = (icon, title, link, value, unit, sub, o = {}) => `<div class="card stat ${o.glow ? 'glow' : ''}"><div class="ch">${badge(icon, o.tone)}<h2>${title}</h2>${link ? `<button class="see-all" data-view="${link}">View</button>` : ''}</div><span class="v num">${value}${unit ? `<small>${unit}</small>` : ''}</span><span class="d">${sub}</span>${o.meter || ''}</div>`;
const EV = {payment_routed:['down','ok'], repay_applied:['split','warn'], draw_opened:['up',''], note_minted:['vault',''], note_settled:['check','ok'], vendor_paid:['bot','op'], loan_closed:['check','ok'], loan_past_due:['warn','warn'], lp_deposit:['down','ok'], lp_withdraw:['up','']};
const evRow = e => `<div class="ev ${e.fresh ? 'fresh' : ''}">${badge(EV[e.k][0], EV[e.k][1])}<div><div class="ev-t">${esc(e.title)}</div><p>${esc(e.text)}</p></div><div class="w">${e.amt ? `<b class="num">${f2(e.amt)}</b>` : ''}${esc(e.t)}</div></div>`;

function chart(){
  const d = S.rev.slice(-30), mx = Math.max(...d, limit() / 10, 1) * 1.15, w = 600, h = 150, bw = w / d.length;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Routed revenue, last 30 days">${d.map((v, i) => `<rect x="${i * bw + 2}" y="${h - v / mx * h}" width="${bw - 4}" height="${v / mx * h}" rx="3"><title>${f2(v)} USDC</title></rect>`).join('')}</svg>`;
}
function loanCard(){
  const L = S.loan;
  if(!L) return `<section class="card panel"><div class="ch">${badge('loan', 'warn')}<h2>Active loan</h2></div><div class="empty"><b>No active loan</b>Draw credit to pay a vendor. It repays itself from the next customer payments, and the draw mints a revenue note.</div><button class="btn primary" data-draw ${canDraw() ? '' : 'disabled'}>${ic('up', 2)}Draw credit</button></section>`;
  const total = debtOf(L), pct = L.repaid / total * 100, left = debtLeft(), days = daysToClear(left);
  return `<section class="card panel"><div class="ch">${badge('loan', 'warn')}<h2>Active loan · ${L.id}</h2><span class="chip blue">Note ${L.id}</span><span class="chip ${S.status === 'delinquent' ? 'bad' : 'ok'}"><span class="dot"></span>${S.status === 'delinquent' ? 'Past due' : 'Self-repaying'}</span></div>
    <div class="loan-top"><span class="big num">${f2(left)}<small>USDC left</small></span><span class="hint">${esc(L.vendor.name)} · ${railLabel(L.vendor)} · due day ${L.due} (${Math.max(0, L.due - S.day)}d)</span></div>
    <div class="debt" id="debt"><i class="paid" style="width:${pct}%"></i></div>
    <div class="debt-l"><span><b class="num">${f2(L.repaid)}</b> repaid of ${f2(total)}</span><span>${Math.round(effSplit() * 100)}% of every payment · clears in ~${days} days</span></div>
    <div class="splitviz ${fresh ? 'on' : ''}" id="splitviz">${fresh ? splitViz(fresh) : ''}</div></section>`;
}
function splitViz(f){
  const a = f.repay / f.amount * 100, b = 100 - a;
  return `<div class="sv-h"><span>Payment in · ${f2(f.amount)} USDC</span><span class="chip ok">${esc(f.ref)}</span></div>
    <div class="sv-bar"><i class="a" style="--w:${a}%">${f2(f.repay)}</i><i class="b" style="--w:calc(${b}% - 3px)">${f2(f.toBiz)}</i></div>
    <div class="sv-leg"><span><b style="color:var(--repay)">●</b> To loan repayment <b class="num">${f2(f.repay)}</b></span><span><b style="color:var(--up)">●</b> To business <b class="num">${f2(f.toBiz)}</b></span></div>`;
}
function vBusiness(){
  const t = trailing(), used = limit() ? Math.min(100, debtLeft() / limit() * 100) : 0, C = COPY[S.kind], pct = Math.round(advanceRate() * 100);
  const banner = S.status === 'delinquent' ? `<div class="banner">${ic('warn', 2)}This loan is past due. New draws are paused until it is repaid, and the repay split is now ${Math.round(effSplit() * 100)}%.</div>` : '';
  return `${banner}<div class="stats">
    ${stat('shield', 'Available credit', 'loans', f2(avail()), 'USDC', `of <b>${f2(limit())}</b> limit · ${pct}% advance rate for ${kindLabel().toLowerCase()}s`, {glow:1, meter:`<span class="meter"><i style="width:${used}%;background:var(--repay)"></i><i style="flex:1;background:var(--up)"></i></span>`})}
    ${stat('loan', 'Owed', 'loans', f2(debtLeft()), 'USDC', S.loan ? `Principal ${f2(S.loan.principal)} + fee ${f2(S.loan.fee)}` : 'No active loan', {tone:'warn'})}
    ${stat('trend', 'Routed revenue · 30d', 'pay', f0(t), 'USDC', `avg <b class="up">${f2(avg7())}</b> / day this week`, {tone:'ok'})}
    ${stat('split', 'Repay split', 'activity', Math.round(effSplit() * 100), '%', 'Taken from each incoming payment', {tone:'op'})}
  </div>
  <div class="grid2">
    <div class="col">${loanCard()}
      <section class="card panel"><div class="ch">${badge('trend', 'ok')}<h2>Revenue routed through RevVault</h2><span class="chip blue">Last 30 days</span></div>${chart()}
        <div class="chart-cap"><span>Only payments to your pay link count as collateral</span><span class="num">limit = min(${f0(t)} × ${pct}%, cap ${f0(P.capUSDC)}) = <b style="color:var(--text)">${f2(limit())}</b></span></div></section>
    </div>
    <div class="col">
      <section class="card panel"><div class="ch">${badge('bot')}<h2>Business constraints</h2>${kindChip()}</div>
        <p class="mandate">${C.mandate}</p>
        <div class="rules"><div class="rule"><span class="k">Max single draw</span><b class="num">${f0(Math.min(limit(), P.maxDraw))} USDC</b></div><div class="rule"><span class="k">Vendor allowlist</span><b>${vendorsFor(S.kind).length} vendors</b></div><div class="rule"><span class="k">Repay split</span><b class="num">${Math.round(effSplit() * 100)}%</b></div><div class="rule"><span class="k">${C.access[0]}</span><b>${C.access[1]}</b></div></div>
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn act-main" data-draw ${canDraw() ? '' : 'disabled'}>${ic('up', 2)}Draw credit</button><button class="btn act-ghost" data-view="pay">${ic('link')}Pay link</button></div></section>
      <section class="card panel"><div class="ch">${badge('pulse')}<h2>${C.activity}</h2><button class="see-all" data-view="activity">See all</button></div><div class="evs">${S.events.slice(0, 5).map(evRow).join('')}</div></section>
    </div></div>`;
}

function vLoans(){
  const rows = [...(S.loan ? [S.loan] : []), ...S.closed], pct = Math.round(advanceRate() * 100);
  return `<section class="card panel"><div class="ch">${badge('loan', 'warn')}<h2>Loan history</h2><button class="btn primary" data-draw ${canDraw() ? '' : 'disabled'}>${ic('plus', 2)}New draw</button></div>
    ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Loan · note</th><th>Vendor</th><th>Opened</th><th>Due</th><th>Repaid</th><th class="amt">Principal</th><th class="amt">Fee</th><th>Status</th></tr></thead><tbody>${rows.map(l => { const tot = debtOf(l), open = l === S.loan, p = l.repaid / tot * 100;
      return `<tr><td class="num"><b>${l.id}</b></td><td><span class="who"><span class="av" style="--c:${l.vendor.c}">${l.vendor.ini}</span>${esc(l.vendor.name)}</span></td><td class="t num">Day ${l.open}</td><td class="t num">Day ${l.due}</td><td><span class="mini-meter"><i style="width:${p}%"></i></span></td><td class="amt num">${f2(l.principal)}</td><td class="amt num">${f2(l.fee)}</td><td>${open ? (S.status === 'delinquent' ? '<span class="chip bad">Past due</span>' : '<span class="chip warn">Open</span>') : '<span class="chip ok">Closed</span>'}</td></tr>`; }).join('')}</tbody></table></div>`
    : '<div class="empty"><b>No loans yet</b>Your first draw will show up here with its repayment schedule.</div>'}</section>
  <section class="card panel"><div class="ch">${badge('shield', 'ok')}<h2>Terms</h2></div><div class="rules">
    <div class="rule"><span class="k">Fee</span><b>${P.feeBps / 100}% flat on principal</b></div><div class="rule"><span class="k">Term</span><b>${P.termDays} days</b></div>
    <div class="rule"><span class="k">Advance rate</span><b>${pct}% of trailing ${P.windowDays}d routed revenue (${kindLabel().toLowerCase()})</b></div><div class="rule"><span class="k">Per-business cap</span><b>${f0(P.capUSDC)} USDC</b></div>
    <div class="rule"><span class="k">Repay split</span><b>${f0(P.splitBps / 100)}% of each payment, ${f0(P.pastDueSplitBps / 100)}% once past due</b></div><div class="rule"><span class="k">Starter limit</span><b>None. No routed revenue, no credit.</b></div></div></section>`;
}

function vPay(){
  const C = COPY[S.kind], B = BUSINESSES[S.kind], ref = `${B.prefix}_${S.inv}`;
  return `<div class="payview"><section class="card panel"><div class="ch">${badge('link', 'ok')}<h2>Your pay link</h2></div>
    <p class="mandate">${C.pay} Every payment lands in RevVault first, which <b>sends ${Math.round(effSplit() * 100)}% to your loan</b> (if you have one) and the rest straight to your wallet. That routed revenue is what your credit limit is built from.</p>
    <div class="linkbox"><span>revvault.app/pay/${esc(S.biz)}?amt=<span id="pl-amt">120</span></span><button class="pill" id="copy">${ic('copy')}Copy</button></div>
    <div class="field" style="margin-top:14px"><label>Amount (USDC)</label><input type="number" id="amt-in" value="120" min="1"></div>
    <div class="field" style="margin-top:12px"><label>Reference</label><input type="text" id="ref-in" value="${ref}"></div>
    <div class="banner info" style="margin-top:14px;font-weight:500">${ic('shield', 2)}${C.direct}</div></section>
    <div><div class="phone"><div class="phone-in" id="phone">
      <div class="ph-biz"><span class="av" style="--c:var(--blue-400)">${B.ini}</span><div><b>${esc(S.biz)}</b><div class="hint">${C.who}</div></div></div>
      <div class="ph-amt num"><span id="ph-amt">120.00</span><small>USDC</small></div>
      <div class="hint" id="ph-ref">${ref}</div>
      <button class="btn primary" id="pay-btn" style="height:46px">Pay with NEAR wallet</button>
      <div class="ph-ok" id="ph-ok"><div class="badge" data-tone="ok" style="margin:0 auto 10px;width:52px;height:52px;border-radius:18px">${ic('check', 2.2)}</div><b>Payment sent</b><div class="hint">Receipt (mock) · routed</div></div>
      <div class="ph-how">How it works: a share of this payment goes toward the seller’s credit repayment. You pay the same amount.</div>
    </div></div><p class="hint" style="text-align:center;margin-top:10px">Customer view · mobile</p></div></div>`;
}

function vActivity(){
  return `<section class="card panel"><div class="ch">${badge('pulse')}<h2>Every cent, on the record</h2></div><div class="evs">${S.events.map(evRow).join('')}</div></section>`;
}

function noteRows(){
  const status = (l, mine) => mine ? (S.status === 'delinquent' ? 'past_due' : 'open') : (l.st === 'delinquent' ? 'past_due' : 'open');
  return [
    ...(S.loan ? [{l:S.loan, status:status(S.loan, true), mine:true}] : []),
    ...S.vault.others.map(l => ({l, status:status(l, false), mine:false})),
    ...S.closed.map(l => ({l, status:'settled', mine:true})),
    ...S.vault.settled.map(l => ({l, status:'settled', mine:false}))
  ];
}
const NOTE_CHIP = {open:'<span class="chip blue">Open</span>', past_due:'<span class="chip bad">Past due</span>', settled:'<span class="chip ok">Settled</span>'};
function notesCard(){
  const all = noteRows(), rows = all.filter(r => S.noteFilter === 'all' || r.l.kind === S.noteFilter);
  const seg = `<div class="seg" role="group" aria-label="Filter notes by kind">${[['all','All'],['agent','Agent'],['creator','Creator']].map(([k, t]) => `<button data-nf="${k}" aria-pressed="${S.noteFilter === k}">${t}</button>`).join('')}</div>`;
  const body = rows.length ? `<div class="tablewrap"><table><thead><tr><th>Note</th><th>Business</th><th class="amt">Debt</th><th>Repaid</th><th>Split</th><th>Due</th><th>Status</th></tr></thead><tbody>${rows.map(({l, status, mine}) => {
      const d = l.due - S.day, p = l.repaid / debtOf(l) * 100;
      return `<tr><td class="num"><b>${l.id}</b></td><td><span class="who"><span class="av">${esc(l.biz[0].toUpperCase())}</span>${esc(l.biz)}${mine ? ' <span class="chip">you</span>' : ''}</span> <span class="chip ${l.kind === 'creator' ? 'op' : 'blue'}">${l.kind === 'creator' ? 'Creator' : 'Agent'}</span></td><td class="amt num">${f2(debtOf(l))}</td><td><span class="who"><span class="mini-meter"><i style="width:${p}%"></i></span><span class="num">${Math.round(p)}%</span></span></td><td class="num">${f0(mine && l === S.loan ? effSplit() * 100 : l.splitBps / 100)}%</td><td class="t num">${status === 'settled' ? '—' : d < 0 ? `${-d}d late` : `${d}d`}</td><td>${NOTE_CHIP[status]}</td></tr>`; }).join('')}</tbody></table></div>`
    : `<div class="empty"><b>${all.length ? 'No notes for this filter' : 'No notes yet'}</b>${all.length ? 'Pick another kind to see more.' : 'A draw mints the first one.'}</div>`;
  return `<section class="card panel"><div class="ch">${badge('vault')}<h2>Revenue notes · pool-held</h2><span class="chip">${all.length} total</span>${seg}</div>${body}
    <p class="hint" style="margin-top:34px">Notes are economic claims recorded in the contract: pool-held, not securities, not transferable in this MVP. Each one follows a single loan’s repayment and settles when it is paid.</p></section>`;
}
function vLp(){
  const open = noteRows().filter(r => r.status !== 'settled'), past = open.filter(r => r.status === 'past_due'), maxP = Math.max(...open.map(r => r.l.principal), 1), tot = open.reduce((s, r) => s + r.l.principal, 0) || 1;
  const pastOut = past.reduce((s, r) => s + outstanding(r.l), 0), myShares = S.myLp.shares, maxOut = Math.min(myShares * nav(), S.vault.cash);
  return `<div class="stats">
    ${stat('vault', 'TVL', '', f0(tvl()), 'USDC', `<b>${f0(S.vault.cash)}</b> cash · ${f0(othersOut() + myOut())} lent`, {glow:1})}
    ${stat('trend', 'Utilisation', '', (util() * 100).toFixed(1), '%', `<span class="meter" style="margin-top:0"><i style="width:${util() * 100}%;background:var(--accent)"></i></span>`, {tone:'op'})}
    ${stat('coin', 'Illustrative APY', '', apy().toFixed(1), '%', `From fees only, over a ${P.termDays}-day term. Not a promise of yield.`, {tone:'ok'})}
    ${stat('shield', 'Reserve (first-loss)', '', f2(S.vault.reserve), 'USDC', `${P.reserveBps / 100}% of collected fees set aside`, {tone:'warn'})}
  </div>
  <div class="grid2">
    <section class="card panel"><div class="ch">${badge('down', 'ok')}<h2>Your pool share</h2></div>
      <div class="bigamt num">${f2(myShares)}<small>rvUSDC</small></div><p class="hint" style="margin:6px 0 14px">≈ ${f2(myShares * nav())} USDC at ${nav().toFixed(4)} USDC per share. Withdrawable now: ${f0(maxOut)} USDC (limited by vault cash).</p>
      <div class="field"><label>Amount (USDC)</label><input type="number" id="lp-amt" value="500" min="1"></div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="lp-dep" style="flex:1">${ic('down', 2)}Fund pool</button><button class="btn secondary" id="lp-wd" style="flex:1">${ic('up', 2)}Withdraw</button></div></section>
    <section class="card panel"><div class="ch">${badge('shield', 'ok')}<h2>Risk panel</h2></div><div class="rules">
      <div class="rule"><span class="k">Advance rate</span><b>${f0(P.advanceBps.agent / 100)}% agent · ${f0(P.advanceBps.creator / 100)}% creator</b></div>
      <div class="rule"><span class="k">Largest borrower</span><b class="num">${Math.round(maxP / tot * 100)}% of open notes</b></div>
      <div class="rule"><span class="k">Past due</span><b class="num">${past.length} of ${open.length}</b></div>
      <div class="rule"><span class="k">Reserve cover</span><b class="num">${(S.vault.reserve / Math.max(1, pastOut) * 100).toFixed(1)}% of past-due</b></div></div>
      <p class="mandate" style="margin:14px 0 0"><b>If a business defaults:</b> its draws stop, the reserve absorbs the first loss, then LP shares absorb the rest. Notes settle when repaid or are written off. Repayment is enforced by economics, not by law.</p></section></div>
  ${notesCard()}`;
}

function vDemo(){
  return `<section class="card panel"><div class="ch">${badge('sliders', 'op')}<h2>Simulate</h2></div>
    <p class="mandate">Drive the whole loop without a wallet. Each button runs the same math the contracts will run. <b>Suggested take:</b> draw 500, send three payments, watch the loan close and the note settle.</p>
    <div class="democtl"><button class="btn primary" data-sim="500">${ic('play')}Customer pays 500</button><button class="btn secondary" data-sim="1000">Customer pays 1,000</button><button class="btn secondary" data-sim="1500">Customer pays 1,500</button><button class="btn secondary" data-week>${ic('trend')}Simulate a week of sales</button></div>
    <p class="hint" style="margin-top:10px">A week of sales sends three payments: 500, 1,000 and 1,500.</p></section>
  <section class="card panel"><div class="ch">${badge('bot')}<h2>Demo business</h2>${kindChip()}</div>
    <div class="seg" role="group" aria-label="Demo business">${['agent', 'creator'].map(k => `<button data-kind="${k}" aria-pressed="${S.kind === k}">${BUSINESSES[k].label} · ${BUSINESSES[k].id}</button>`).join('')}</div>
    <p class="hint" style="margin-top:10px">Switching reseeds the demo with that business. A creator has lumpier revenue, so the advance rate is ${f0(P.advanceBps.creator / 100)}% instead of ${f0(P.advanceBps.agent / 100)}%.</p></section>
  <section class="card panel"><div class="ch">${badge('clock', 'warn')}<h2>Time</h2><span class="chip">Day ${S.day}</span></div>
    <div class="democtl"><button class="btn secondary" data-ff="7">+7 days</button><button class="btn secondary" data-ff="${P.termDays + 1}">+${P.termDays + 1} days (go past due)</button></div>
    <p class="hint" style="margin-top:10px">Skipping days adds zero-revenue days, so your trailing revenue and limit shrink.</p></section>
  <section class="card panel"><div class="ch">${badge('refresh')}<h2>Reset</h2></div><button class="btn danger" id="reset">${ic('refresh')}Reset seed data</button></section>`;
}

function bind(){
  $$('#main [data-view]').forEach(b => b.onclick = () => go(b.dataset.view));
  $$('[data-draw]').forEach(b => b.onclick = () => drawFlow());
  $$('[data-sim]').forEach(b => b.onclick = () => simulate(+b.dataset.sim));
  $$('[data-week]').forEach(b => b.onclick = () => simulateWeek());
  $$('[data-ff]').forEach(b => b.onclick = () => { fastForward(+b.dataset.ff); toast(`+${b.dataset.ff} days`); render(); });
  $$('[data-nf]').forEach(b => b.onclick = () => { S.noteFilter = b.dataset.nf; render(); });
  $$('[data-kind]').forEach(b => b.onclick = () => { seed(b.dataset.kind); toast(`Demo business: ${S.biz}`); render(); });
  const r = $('#reset'); if(r) r.onclick = () => { seed(S.kind); toast('Seed data restored'); render(); };
  const ai = $('#amt-in'); if(ai){
    const upd = () => { $('#pl-amt').textContent = ai.value || 0; $('#ph-amt').textContent = f2(+ai.value || 0); };
    ai.oninput = upd; $('#ref-in').oninput = e => $('#ph-ref').textContent = e.target.value;
    $('#copy').onclick = () => toast('Pay link copied');
    $('#pay-btn').onclick = () => { const a = +ai.value || 0; if(a <= 0) return; const ref = $('#ref-in').value; simulate(a, ref, true); $('#pay-btn').hidden = true; $('#ph-ok').classList.add('on'); };
  }
  const dep = $('#lp-dep'); if(dep){
    dep.onclick = () => { const a = +$('#lp-amt').value; if(a <= 0 || a > S.wallet) return toast('Check the amount and your balance'); const sh = a / nav(); S.wallet -= a; S.myLp.shares += sh; S.vault.shares += sh; S.vault.cash += a; log('lp_deposit', 'Pool deposit', `${f2(a)} USDC supplied · ${f2(sh)} rvUSDC`, a); toast('Deposited'); render(); };
    $('#lp-wd').onclick = () => { const a = +$('#lp-amt').value; const max = Math.min(S.myLp.shares * nav(), S.vault.cash); if(a <= 0 || a > max) return toast(`Max withdrawable ${f0(max)} USDC`); const sh = a / nav(); S.wallet += a; S.myLp.shares -= sh; S.vault.shares -= sh; S.vault.cash -= a; log('lp_withdraw', 'Pool withdrawal', `${f2(a)} USDC withdrawn · ${f2(sh)} rvUSDC`, a); toast('Withdrawn'); render(); };
  }
}
function simulate(amount, ref, stay){
  ref = ref || `${BUSINESSES[S.kind].prefix}_${S.inv++}`;
  const r = routePayment(amount, ref);
  fresh = {amount, ref, repay:r.repay, toBiz:r.toBiz};
  if(r.closed) toast(`${f2(r.repay)} repaid · loan closed, note settled`);
  else if(r.repay) toast(`${f2(r.repay)} repaid · ${f2(r.toBiz)} to you`); else toast(`${f2(amount)} USDC routed`);
  if(stay){ renderSide(); return; }
  view = 'business'; location.hash = '#/business'; render();
}
function simulateWeek(){
  let repay = 0, toBiz = 0, total = 0, closed = false;
  [500, 1000, 1500].forEach(a => { const r = routePayment(a, `${BUSINESSES[S.kind].prefix}_${S.inv++}`); repay += r.repay; toBiz += r.toBiz; total += a; closed = closed || r.closed; });
  fresh = {amount:total, ref:'3 payments', repay, toBiz};
  toast(`Week of sales: ${f0(total)} routed · ${f2(repay)} repaid${closed ? ' · loan closed, note settled' : ''}`);
  view = 'business'; location.hash = '#/business'; render();
}

function drawFlow(){
  if(S.loan) return toast('One open loan at a time. Repay it before drawing again.');
  if(!canDraw()) return toast('No credit available right now');
  const max = Math.floor(Math.min(avail(), P.maxDraw, S.vault.cash)), vendors = vendorsFor(S.kind);
  let step = 0, amount = Math.min(P.maxDraw, max), vendor = vendors[0];
  const draw = () => {
    const fee = amount * P.feeBps / 1e4, total = amount + fee, days = daysToClear(total);
    const steps = `<div class="steps">${[0, 1, 2].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
    const body = [
      `<div class="bigamt num"><span id="da">${f2(amount)}</span><small>USDC</small></div><div class="field"><input type="range" id="sl" min="${P.minDraw}" max="${max}" step="10" value="${amount}" aria-label="Draw amount"></div>
       <div class="hint">Available ${f2(avail())} · max this draw ${f0(max)}. Repayment starts from your next payment.</div>`,
      `<div class="picks">${vendors.map(v => `<button class="pick" data-v="${v.id}" aria-pressed="${v.id === vendor.id}"><span class="av" style="--c:${v.c}">${v.ini}</span><span><b>${esc(v.name)}</b><small>${esc(v.what)} · ${railLabel(v)}</small></span></button>`).join('')}</div><div class="hint">Funds go straight to the vendor. They never touch your wallet.</div>`,
      `<div class="review"><div class="row"><span>Paid to ${esc(vendor.name)}</span><b class="num">${f2(amount)} USDC</b></div><div class="row"><span>Fee (${P.feeBps / 100}%)</span><b class="num">${f2(fee)} USDC</b></div><hr><div class="row"><span>You repay</span><b class="num">${f2(total)} USDC</b></div><div class="row"><span>Repay split</span><b>${Math.round(effSplit() * 100)}% of each payment</b></div><div class="row"><span>Estimated to clear</span><b>~${days} days at ${f0(avg7())}/day</b></div><div class="row"><span>Revenue note</span><b>${nextNoteId()} · pool-held</b></div>${days > P.termDays ? `<div class="warn-t" style="margin-top:6px">At today’s pace this would run past the ${P.termDays}-day term. Consider a smaller draw.</div>` : ''}</div>`
    ][step];
    $('#modal').innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="Draw credit"><div class="modal-h">${steps}<div class="row"><h2>${['How much?', 'Pay which vendor?', 'Review and confirm'][step]}</h2><span>Step ${step + 1} of 3</span></div></div><div class="modal-b">${body}</div>
      <div class="modal-f"><button class="btn ghost" id="mx">${step ? 'Back' : 'Cancel'}</button><button class="btn primary" id="mn">${step === 2 ? 'Confirm draw' : 'Continue'}</button></div></div></div>`;
    const sl = $('#sl'); if(sl) sl.oninput = () => { amount = +sl.value; $('#da').textContent = f2(amount); };
    $$('[data-v]').forEach(b => b.onclick = () => { vendor = vendors.find(v => v.id === b.dataset.v); draw(); });
    $('#mx').onclick = () => step ? (step--, draw()) : close();
    $('#mn').onclick = () => { if(step < 2){ step++; draw(); } else { const L = requestDraw(amount, vendor, 'Compute'); close(); if(!L) return toast('One open loan at a time. Repay it before drawing again.'); toast(`${railLabel(vendor)} · ${f2(amount)} USDC to ${vendor.name} · note ${L.id} minted`); view = 'business'; render(); } };
    $('#scrim').onclick = e => { if(e.target.id === 'scrim') close(); };
  };
  const close = () => { $('#modal').innerHTML = ''; };
  draw();
}
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ $('#modal').innerHTML = ''; if(moreOpen){ moreOpen = false; renderSide(); } } });
document.addEventListener('click', e => { if(moreOpen && !e.target.closest('.more-wrap')){ moreOpen = false; renderSide(); } });
const fromHash = () => { const h = location.hash.replace('#/', ''); if(TITLES[h]) view = h; };
window.addEventListener('hashchange', () => { const prev = view; fromHash(); if(view !== prev) render(); });
fromHash(); render();
})();
</script>
</body>
</html>
