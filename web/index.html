<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RevVault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='5' fill='%233E68FE'/%3E%3Cg fill='none' stroke='white' stroke-width='1.4' stroke-linecap='round'%3E%3Crect x='4' y='5' width='12' height='10' rx='2.5'/%3E%3Ccircle cx='10' cy='10' r='2.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--text)}
body{font:400 0.875rem/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .warn-t{color:var(--warn)}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--blue-300);outline-offset:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:2.75rem;padding:.5rem 1.1rem;border-radius:var(--r-pill);font-weight:600;font-size:0.8438rem;white-space:nowrap;transition:background-color .2s var(--glide),box-shadow .2s var(--glide),opacity .15s,transform .15s var(--glide)}
.btn:active{transform:scale(.98)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow-btn)}
.btn.primary:hover{background:var(--blue-hover)}
.btn.secondary{background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.secondary:hover{background:var(--hover)}
.btn.danger{color:var(--down);background:rgba(255,126,97,.1);box-shadow:inset 0 0 0 1px rgba(255,126,97,.22)}
.btn.ghost{color:var(--mute)} .btn.ghost:hover{color:var(--text);background:var(--card-2)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.65;cursor:not-allowed;box-shadow:none}
.act-main{min-height:3rem;padding:.5rem 1.4rem .5rem 1.1rem;color:var(--accent-ink);background:var(--accent);box-shadow:var(--glow-btn)}
.act-main:hover{background:var(--blue-hover)}
.act-ghost{min-height:3rem;padding:.5rem 1.1rem .5rem .9rem;color:var(--text);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.act-ghost:hover{background:var(--hover)}
.act-ghost svg{color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:2.75rem;padding:0 1rem;border-radius:var(--r-pill);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);font-size:0.7813rem;font-weight:500;white-space:nowrap}
.pill:hover{background:var(--hover)}
.pill svg{width:15px;height:15px}
.round{display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--mute)}
.round:hover{color:var(--text);background:var(--hover)} .round svg{width:16px;height:16px}
.badge{--t:62,104,254;--ic:var(--accent-text);display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-tile);color:var(--ic);background:radial-gradient(50% 50% at 50% 0,rgba(var(--t),.30) 0%,var(--card) 100%);box-shadow:inset 0 0 0 1px rgba(var(--t),.28)}
.badge svg{width:18px;height:18px}
.badge[data-tone]{--ic:rgb(var(--t))}
.badge[data-tone="op"]{--t:92,211,255}.badge[data-tone="warn"]{--t:242,190,92}.badge[data-tone="ok"]{--t:134,227,181}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:1.5rem;padding:.1rem .65rem;border-radius:var(--r-pill);font-size:0.7188rem;font-weight:600;background:var(--card-2);color:var(--mute);white-space:nowrap}
.chip svg{width:.8rem;height:.8rem}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:rgba(134,227,181,.11);color:var(--ok)}
.chip.bad{background:rgba(255,126,97,.13);color:var(--down)}
.chip.warn{background:rgba(242,190,92,.13);color:var(--warn)}
.chip.blue{background:var(--accent-soft);color:var(--accent-text)}
.chip.op{background:rgba(92,211,255,.12);color:var(--op)}

.fnav-in{flex-wrap:wrap}
#acct{margin-left:auto}
.stat .v,.hero-v,.tile .big,.bigamt,.note-debt,.loan-top .big,.next-b h3,.next-b>p,.linkbox{overflow-wrap:anywhere}
.shell{display:flex;flex-direction:column;gap:16px;padding:20px 16px 48px;max-width:1280px;margin:0 auto;min-height:100vh}
.card{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-card);transition:box-shadow .3s var(--glide)}
.glow{background:var(--glow-card);box-shadow:inset 0 0 0 1px var(--accent-line)}
.fnav{position:sticky;top:20px;z-index:40;display:flex;justify-content:center;pointer-events:none}
.fnav-in{pointer-events:auto;display:flex;align-items:center;gap:6px;width:100%;padding:10px 10px 10px 22px;border-radius:44px;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 0 0 1px var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-right:14px;flex:none}
.brand .mk{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand .mk svg{width:15px;height:15px}
.brand .wm{font:700 1rem/1 var(--sans);letter-spacing:-.02em;color:#fff}
.nav{display:flex;align-items:center;gap:2px;margin:0 auto}
.nav :is(a,button){position:relative;display:inline-flex;align-items:center;gap:8px;min-height:2.75rem;padding:0 16px;border-radius:var(--r-pill);color:var(--link);font-size:0.875rem;font-weight:500;white-space:nowrap;transition:background-color .2s,color .2s}
.nav svg{width:16px;height:16px;color:var(--faint)}
.nav :is(a,button):hover{background:var(--glass-fill);color:#fff}.nav :is(a,button):hover svg{color:#fff}
.nav [aria-current="page"]{color:#fff;font-weight:600;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav [aria-current="page"] svg{color:var(--accent-text)}
.nav .dotn{position:absolute;top:8px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.more-wrap{position:relative}
.more-wrap .chev{width:14px;height:14px;transition:transform .15s}
.more-wrap button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 10px);z-index:45;width:min(15rem,calc(100vw - 2rem));padding:6px;border-radius:var(--r-card);background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2),0 24px 50px -12px rgba(0,0,0,.7);animation:pop .15s var(--glide)}
.menu :is(a,button){display:flex;align-items:center;gap:10px;width:100%;min-height:2.75rem;padding:.35rem 12px;border-radius:var(--r-tile);color:var(--link);font-size:0.8438rem;font-weight:500;text-align:left}
.menu :is(a,button) svg{width:16px;height:16px;color:var(--faint)}
.menu :is(a,button):hover,.menu :is(a,button)[aria-current="page"]{background:var(--glass-fill);color:#fff}
.menu small{display:block;color:var(--faint);font-size:0.7188rem;font-weight:400;margin-top:1px}
.netchip{display:inline-flex;align-items:center;gap:8px;min-height:2.75rem;padding:0 12px;border-radius:var(--r-pill);font-size:0.75rem;font-weight:600;color:var(--mute);flex:none}
.netchip i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.acct-chip{display:inline-flex;align-items:center;gap:8px;min-height:2.75rem;padding:0 14px 0 5px;border-radius:var(--r-pill);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);font-size:0.8125rem;font-weight:600;white-space:nowrap;flex:none}
.acct-chip:hover{background:var(--hover)}
.acct-chip .wav{width:28px;height:28px;border-radius:50%;background:conic-gradient(from 90deg,var(--op),var(--blue-400),var(--blue-500),var(--op))}
.acct-chip small{color:var(--mute);font-weight:500}
.body{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.crumb{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;min-width:0}
.crumb h1{font-size:1.375rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.crumb span{color:var(--faint);font-size:0.8125rem;overflow-wrap:anywhere}
#tx-slot:empty{display:none}
.main>.switchrow{align-self:flex-start}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}

.ch{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .65rem;margin-bottom:16px}
.ch h2{font-size:1rem;font-weight:600;letter-spacing:-.01em;margin-right:auto;overflow-wrap:anywhere}
.ch .see-all{padding:6px 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font:500 0.7813rem/1 var(--sans);white-space:nowrap}
.ch .see-all:hover{color:var(--text);background:rgba(255,255,255,.08)}
.panel{padding:20px}
.panel .ch{flex-wrap:wrap;row-gap:10px}
.mosaic{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.mosaic>*{min-width:0}
.m-path{grid-area:path}.m-flow{grid-area:flow}.m-hero{grid-area:hero}.m-side{grid-area:side}.m-chart{grid-area:chart}.m-cons{grid-area:cons}
.m-tvl{grid-area:tvl}.m-apy{grid-area:apy}.m-rsv{grid-area:rsv}
.mosaic.dash{grid-template-areas:"path path path path path path path path path path path path" "hero hero hero hero hero hero hero side side side side side" "flow flow flow flow flow flow flow flow flow flow flow flow" "chart chart chart chart chart chart chart cons cons cons cons cons"}
.mosaic.pool{grid-template-areas:"tvl tvl tvl tvl tvl tvl tvl apy apy apy apy apy" "tvl tvl tvl tvl tvl tvl tvl rsv rsv rsv rsv rsv"}
.stat{padding:18px 20px 20px;display:flex;flex-direction:column;min-width:0}
.stat .ch{margin-bottom:16px}.stat .ch h2{font-size:0.875rem;white-space:normal;min-width:0}
.stat .v{font-size:1.75rem;font-weight:500;letter-spacing:-.03em;line-height:1}
.stat .v small{font-size:0.875rem;font-weight:500;color:var(--mute);margin-left:6px;letter-spacing:0}
.stat .d{margin-top:12px;color:var(--mute);font-size:0.8125rem}.stat .d b{font-weight:600}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .loan{flex:1}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat.hot{background:linear-gradient(180deg,rgba(242,190,92,.10),var(--card) 75%);box-shadow:inset 0 0 0 1px rgba(242,190,92,.28)}
.stat.hot .v{color:var(--warn)}
.stat.apy{box-shadow:none;border:1px dashed var(--line-2);background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 7px,transparent 7px 14px),var(--card)}
.stat.rsv{background:linear-gradient(180deg,rgba(242,190,92,.08),var(--card) 70%);box-shadow:inset 0 0 0 1px rgba(242,190,92,.22)}
.ring{--p:0;flex:none;display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--repay) calc(var(--p)*1%),rgba(255,255,255,.08) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px))}
.hero{padding:26px 28px 28px;display:flex;flex-direction:column}
.hero .ch{margin-bottom:22px}
.hero-v{font-size:clamp(44px,5.2vw,68px);font-weight:500;letter-spacing:-.04em;line-height:1}
.hero-v small{font-size:1rem;font-weight:500;color:var(--mute);margin-left:10px;letter-spacing:0}
.limitbar{display:flex;gap:3px;height:10px;margin:26px 0 14px}
.limitbar i{display:block;height:100%;border-radius:5px;transform-origin:left}
.limitbar .u{background:var(--u,var(--repay))}
.limitbar .a{flex:1;background:var(--up)}
.hero-facts{display:flex;flex-wrap:wrap;gap:10px 32px}
.hero-facts span{display:flex;flex-direction:column;gap:2px;color:var(--faint);font-size:0.75rem;font-weight:500}
.hero-facts b{color:var(--text);font-size:0.875rem;font-weight:600}
.hero-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:26px}
.hero-hint{margin-top:12px}
@keyframes meterIn{from{transform:scaleX(0)}}
@keyframes barIn{from{transform:scaleY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.main:not(.still) .limitbar i,.main:not(.still) .note-bar i{animation:meterIn .9s .15s var(--glide) backwards}
.main:not(.still) .bars i{animation:barIn .7s var(--glide) backwards;animation-delay:calc(var(--n)*14ms + .1s)}
.main:not(.still) .rise{animation:rise .55s var(--glide) backwards}
.main:not(.still) .rise:nth-child(2){animation-delay:.06s}
.main:not(.still) .rise:nth-child(3){animation-delay:.12s}
.main:not(.still) .rise:nth-child(4){animation-delay:.18s}
.main:not(.still) .rise:nth-child(5){animation-delay:.24s}
.main:not(.still) .rise:nth-child(n+6){animation-delay:.3s}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;padding:3px;border-radius:1.75rem;background:var(--card-2);gap:2px}
.seg button{min-height:2.75rem;padding:0 .95rem;border-radius:var(--r-pill);color:var(--mute);font-size:0.75rem;font-weight:600}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--page);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rule{padding:11px 14px;border-radius:14px;background:var(--card-2)}
.rule .k{display:block;color:var(--faint);font-size:0.75rem;font-weight:500}
.rule b{font-weight:600;overflow-wrap:anywhere}
.cons-body{display:grid;gap:16px}
.cons-body .mandate{margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:var(--r-item);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .25s var(--glide),background-color .25s var(--glide)}
.tile .k{color:var(--faint);font-size:0.75rem;font-weight:500}
.tile .big{overflow-wrap:anywhere;font-size:1.875rem;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.tile .big small{font-size:0.875rem;color:var(--mute);margin-left:5px;letter-spacing:0}
.tile .s{color:var(--mute);font-size:0.7813rem}
.tile.none{background:transparent;box-shadow:none;border:1px dashed var(--line-2)}
.tile.none .big{font-size:1.375rem}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:14px}
.note{--tone:var(--accent);display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px;border-radius:var(--r-card);background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 13%,var(--card-2)),var(--card-2) 65%);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .25s var(--glide),transform .25s var(--glide)}
.note[data-s="past_due"],.note[data-s="written_off"]{--tone:var(--down)}
.note[data-s="settled"]{--tone:var(--ok)}
.note-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.note-id{font-size:1rem;font-weight:700;letter-spacing:.02em}
.note-debt{font-size:1.875rem;font-weight:500;letter-spacing:-.03em;line-height:1}
.note-debt small{display:block;margin-top:6px;color:var(--faint);font-size:0.75rem;font-weight:500;letter-spacing:0}
.note[data-s="settled"] .note-debt{color:var(--mute)}
.note-r{display:flex;justify-content:space-between;color:var(--faint);font-size:0.75rem;margin-bottom:6px}
.note-r b{color:var(--text);font-weight:600}
.note-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.note-bar i{display:block;height:100%;background:var(--tone);transform-origin:left}
.note-f{position:relative;display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px dashed var(--line-2);color:var(--mute);font-size:0.7813rem}
.note-f::before,.note-f::after{content:"";position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--card)}
.note-f::before{left:-26px}.note-f::after{right:-26px}
@media (hover:hover) and (pointer:fine){
  .note:hover,.tile:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tone,var(--accent)) 55%,transparent)}
  .note:hover{transform:translateY(-2px)}
  .tile:hover{background:var(--hover)}
}
.mandate{color:var(--mute);line-height:1.6;margin-bottom:14px}.mandate b{color:var(--text);font-weight:600}

.loan-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.loan-top .big{font-size:2.25rem;font-weight:500;letter-spacing:-.03em;line-height:1}
.loan-top .big small{font-size:0.875rem;color:var(--mute);margin-left:6px;letter-spacing:0}
.debt{position:relative;height:14px;border-radius:7px;background:var(--card-2);overflow:hidden;display:flex;margin:18px 0 10px}
.debt i{display:block;height:100%;transition:width 1.1s var(--glide)}
.debt .paid{background:var(--ok)}
.debt .flash{background:var(--repay)}
.debt-l{display:flex;justify-content:space-between;color:var(--faint);font-size:0.7813rem;gap:10px;flex-wrap:wrap}
.debt-l b{color:var(--text);font-weight:600}
.loan.live{background:radial-gradient(120% 90% at 0 0,rgba(242,190,92,.13) 0%,rgba(242,190,92,0) 60%),var(--card);box-shadow:inset 0 0 0 1px rgba(242,190,92,.3)}
.loan.idle{box-shadow:none;border:1px dashed var(--line-2);background:transparent}
.flow3{list-style:none;display:grid;gap:10px;counter-reset:f;margin-top:4px}
.flow3 li{counter-increment:f;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;color:var(--mute);line-height:1.45}
.flow3 li::before{content:counter(f);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2);font-weight:700;font-size:0.7813rem;color:var(--text)}
.splitviz{margin-top:16px;padding:14px;border-radius:var(--r-item);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);display:none}
.splitviz.on{display:block;animation:pop .25s var(--glide)}
.sv-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:12px}
.sv-bar{display:flex;height:34px;border-radius:var(--r-tile);overflow:hidden;gap:3px}
.sv-bar i{display:grid;place-items:center;height:100%;font-style:normal;font-size:0.75rem;font-weight:700;color:var(--ink);transform-origin:left;white-space:nowrap}
.sv-bar .a{background:var(--repay);width:0;animation:grow .9s .35s var(--glide) forwards}
.sv-bar .b{background:var(--up);width:0;animation:grow .9s .35s var(--glide) forwards}
.sv-bar.start{background:var(--accent);animation:none}
@keyframes grow{to{width:var(--w)}}
.sv-leg{display:flex;justify-content:space-between;margin-top:10px;font-size:0.7813rem;color:var(--mute)}
.sv-leg b{color:var(--text);font-weight:600}
.empty{padding:28px 12px;text-align:center;color:var(--faint)}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px}

.chart-top{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.chart-top .v{font-size:2.125rem;font-weight:500;letter-spacing:-.03em;line-height:1}
.chart-top .v small{font-size:0.875rem;color:var(--mute);margin-left:6px;letter-spacing:0}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px;border-bottom:1px solid var(--line-2)}
.bars i{flex:1;min-width:0;height:var(--h);min-height:3px;border-radius:4px 4px 1px 1px;background:var(--accent);transform-origin:bottom;transition:background-color .15s}

.fl-arrow{color:var(--faint)}.fl-arrow svg{width:1.4rem;height:1.4rem}
.sv-bar.flat{margin-top:1rem;height:.9rem}

.flow-note{margin-top:.9rem}

  .journey{padding:1rem}

  .next-ill .ill{max-height:6rem}
  .next-b h3{font-size:1.3rem}
  .flow{grid-template-columns:minmax(0,1fr)}
  .fl-arrow{justify-self:center;transform:rotate(90deg)}
}
.l-short{display:none}
@media (max-width:860px){.nav .l-full{display:none}.nav .l-short{display:inline}}
@media (max-width:700px){
  .btn,.chip{white-space:normal;max-width:100%;text-align:center}

  .note .who{flex-wrap:wrap;white-space:normal}

.readonly>span b{color:var(--accent-text)}
@media (forced-colors:active){.btn{border:1px solid ButtonText}.st-dot,.chip{border:1px solid CanvasText}}
